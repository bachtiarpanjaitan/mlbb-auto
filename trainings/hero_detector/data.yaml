# YOLOv11n dataset config — MLBB Minimap Detection (9 classes)
# Classes:
#   0 = hero
#   1 = legend (lord/turtle)
#   2 = thunder_fenrir  (blue buff)
#   3 = molten_fiend    (red buff)
#   4 = lithowanderer
#   5 = crab
#   6 = lava_golem
#   7 = fire_beetle
#   8 = horned_lizard

# Paths relative to project root
path: trainings/hero_detector
train: images/train
val: images/val

nc: 9
names: ['hero', 'legend', 'thunder_fenrir', 'molten_fiend', 'lithowanderer', 'crab', 'lava_golem', 'fire_beetle', 'horned_lizard']
