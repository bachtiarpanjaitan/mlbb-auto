# YOLOv11n dataset config — MLBB Minimap Detection
# Classes:
#   0  = blue_hero       (hero tim biru)
#   1  = red_hero        (hero tim merah)
#   2  = lord            (Lord Pit — sungai atas)
#   3  = turtle          (Turtle Pit — sungai bawah)
#   4  = thunder_fenrir  (Blue Buff, di dua sisi)
#   5  = molten_fiend    (Red Buff, di dua sisi)
#   6  = lithowanderer   (Litho — tengah)
#   7  = crab            (Gold Crab, atas & bawah)
#   8  = lava_golem      (Golem, dua sisi)
#   9  = fire_beetle     (Beetle, dua sisi)
#   10 = horned_lizard   (Lizard, dua sisi)

# Paths relative to project root
path: trainings/hero_detector
train: images/train
val: images/val

nc: 11
names: [
  'blue_hero', 'red_hero',
  'lord', 'turtle',
  'thunder_fenrir', 'molten_fiend',
  'lithowanderer', 'crab',
  'lava_golem', 'fire_beetle', 'horned_lizard'
]
